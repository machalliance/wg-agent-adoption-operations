<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="1000" height="1080" role="img" aria-labelledby="svg-title svg-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="svg-title">Agent Governance, Safety and Compliance: A Layered Model</title>
  <desc id="svg-desc">Five layers stacked in one column. Policy, Platform Controls, Agent Design, Live Operations and Audit Evidence. Grey arrows run down the column. One orange arrow returns from Audit Evidence to Policy.</desc>

  <rect width="1000" height="1080" fill="#ffffff"/>

  <text x="500" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Agent Governance, Safety and Compliance: A Layered Model</text>
  <text x="500" y="76" text-anchor="middle" font-size="16" fill="#475569">MACH Alliance Agent Adoption &amp; Operations Working Group</text>

  <!-- Layer 1 -->
  <rect x="70" y="108" width="620" height="105" rx="10" fill="#bcd9f7"/>
  <text x="98" y="142" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f172a">LAYER 1 — POLICY</text>
  <text x="98" y="182" font-size="25" font-weight="700" fill="#0f172a">Risk Tiers and the Tier Test</text>

  <!-- 1 to 2 -->
  <line x1="200" y1="225" x2="200" y2="267" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,266 208,266 200,281" fill="#64748b"/>
  <text x="236" y="246" font-size="16" font-style="italic" fill="#475569">tiers set the controls</text>

  <!-- Layer 2 -->
  <rect x="70" y="291" width="620" height="105" rx="10" fill="#6aa8f0"/>
  <text x="98" y="325" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f172a">LAYER 2 — PLATFORM CONTROLS</text>
  <text x="98" y="365" font-size="25" font-weight="700" fill="#0f172a">Access Control Ladder</text>

  <!-- 2 to 3 -->
  <line x1="200" y1="408" x2="200" y2="450" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,449 208,449 200,464" fill="#64748b"/>
  <text x="236" y="429" font-size="16" font-style="italic" fill="#475569">controls limit each agent</text>

  <!-- Layer 3 -->
  <rect x="70" y="474" width="620" height="105" rx="10" fill="#1f6fc4"/>
  <text x="98" y="508" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">LAYER 3 — AGENT DESIGN</text>
  <text x="98" y="548" font-size="25" font-weight="700" fill="#ffffff">Agent Design Document</text>

  <!-- 3 to 4 -->
  <line x1="200" y1="591" x2="200" y2="633" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,632 208,632 200,647" fill="#64748b"/>
  <text x="236" y="612" font-size="16" font-style="italic" fill="#475569">a person approves the agent</text>

  <!-- Layer 4 -->
  <rect x="70" y="657" width="620" height="200" rx="10" fill="#14509e"/>
  <text x="98" y="691" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">LAYER 4 — LIVE OPERATIONS</text>
  <text x="98" y="726" font-size="22" font-weight="700" fill="#ffffff">Continuous</text>
  <text x="98" y="751" font-size="17" fill="#ffffff">Monitoring Plan</text>
  <line x1="98" y1="768" x2="662" y2="768" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="98" y="801" font-size="22" font-weight="700" fill="#ffffff">Triggered</text>
  <text x="98" y="826" font-size="17" fill="#ffffff">Incident Playbook</text>

  <!-- 4 to 5 -->
  <line x1="200" y1="869" x2="200" y2="911" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,910 208,910 200,925" fill="#64748b"/>
  <text x="236" y="890" font-size="16" font-style="italic" fill="#475569">records become evidence</text>

  <!-- Layer 5 -->
  <rect x="70" y="935" width="620" height="105" rx="10" fill="#0d2f5e"/>
  <text x="98" y="969" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">LAYER 5 — AUDIT EVIDENCE</text>
  <text x="98" y="1009" font-size="25" font-weight="700" fill="#ffffff">Audit Log Rules</text>

  <!-- return path, Layer 5 back up to Layer 1 -->
  <path d="M 690 987 H 780 V 160 H 702" fill="none" stroke="#c2410c" stroke-width="3"/>
  <polygon points="703,152 703,168 688,160" fill="#c2410c"/>
  <text x="800" y="555" font-size="16" font-weight="700" fill="#c2410c">audit findings</text>
  <text x="800" y="577" font-size="16" font-weight="700" fill="#c2410c">correct the tiers</text>
</svg>
