<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1090" width="1000" height="1090" role="img" aria-labelledby="svg-title svg-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="svg-title">Agent Governance and Assurance: The Five Stages</title>
  <desc id="svg-desc">Five stages stacked in one column, in the order you work in. Agent Design, Policy, Platform Controls, Live Operations, and Audit and Assurance. Grey arrows run down the column from each stage to the next, and one arrow returns up the right-hand side from the last stage to the first.</desc>

  <rect width="1000" height="1090" fill="#ffffff"/>

  <text x="500" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Agent Governance and Assurance: The Five Stages</text>
  <text x="500" y="76" text-anchor="middle" font-size="16" fill="#475569">MACH Alliance Agent Adoption &amp; Operations Working Group</text>

  <!-- Stage 1 -->
  <rect x="70" y="108" width="760" height="105" rx="10" fill="#bcd9f7"/>
  <text x="98" y="142" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f172a">STAGE 1 — AGENT DESIGN</text>
  <text x="98" y="182" font-size="25" font-weight="700" fill="#0f172a">Agent Design Document</text>

  <!-- 1 to 2 -->
  <line x1="200" y1="225" x2="200" y2="267" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,266 208,266 200,281" fill="#64748b"/>
  <text x="236" y="246" font-size="16" font-style="italic" fill="#475569">the design gets classified</text>

  <!-- Stage 2 -->
  <rect x="70" y="291" width="760" height="105" rx="10" fill="#6aa8f0"/>
  <text x="98" y="325" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0f172a">STAGE 2 — POLICY</text>
  <text x="98" y="365" font-size="24" font-weight="700" fill="#0f172a">Risk Classifications and the Classification Test</text>

  <!-- 2 to 3 -->
  <line x1="200" y1="408" x2="200" y2="450" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,449 208,449 200,464" fill="#64748b"/>
  <text x="236" y="429" font-size="16" font-style="italic" fill="#475569">the classification sets the controls</text>

  <!-- Stage 3 -->
  <rect x="70" y="474" width="760" height="105" rx="10" fill="#1f6fc4"/>
  <text x="98" y="508" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">STAGE 3 — PLATFORM CONTROLS</text>
  <text x="98" y="548" font-size="25" font-weight="700" fill="#ffffff">Platform Control Levels</text>

  <!-- 3 to 4 -->
  <line x1="200" y1="591" x2="200" y2="633" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,632 208,632 200,647" fill="#64748b"/>
  <text x="236" y="612" font-size="16" font-style="italic" fill="#475569">one person signs off</text>

  <!-- Stage 4 -->
  <rect x="70" y="657" width="760" height="200" rx="10" fill="#14509e"/>
  <text x="98" y="691" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">STAGE 4 — LIVE OPERATIONS</text>
  <text x="98" y="726" font-size="22" font-weight="700" fill="#ffffff">Continuous</text>
  <text x="98" y="751" font-size="17" fill="#ffffff">Monitoring Plan</text>
  <line x1="98" y1="768" x2="802" y2="768" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="98" y="801" font-size="22" font-weight="700" fill="#ffffff">Triggered</text>
  <text x="98" y="826" font-size="17" fill="#ffffff">Incident Playbook</text>

  <!-- 4 to 5 -->
  <line x1="200" y1="869" x2="200" y2="911" stroke="#64748b" stroke-width="3"/>
  <polygon points="192,910 208,910 200,925" fill="#64748b"/>
  <text x="236" y="890" font-size="16" font-style="italic" fill="#475569">records become evidence</text>

  <!-- Stage 5 -->
  <rect x="70" y="935" width="760" height="105" rx="10" fill="#0d2f5e"/>
  <text x="98" y="969" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffffff">STAGE 5 — AUDIT AND ASSURANCE</text>
  <text x="98" y="1009" font-size="25" font-weight="700" fill="#ffffff">Audit Log Rules and the Assurance Record</text>

  <!-- 5 back to 1 -->
  <path d="M 830 987 H 890 V 160 H 845" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="846,152 846,168 831,160" fill="#64748b"/>
  <text transform="rotate(-90 916 575)" x="916" y="575" text-anchor="middle" font-size="16" font-style="italic" fill="#475569">findings correct the design and the classification</text>

</svg>
